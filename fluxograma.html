oke="#6B7B80" stroke-width="1.2"/><text x="620.0" y="652.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1E2C31">Câmara de espera</text><text x="620.0" y="674.5" text-anchor="middle" font-size="13.5" fill="#4A5C62">pilha identificada com a etiqueta do cliente</text><line x1="620" y1="696" x2="620" y2="738" stroke="#54666C" stroke-width="1.6" marker-end="url(#a)"/><polygon points="620,744.0 835.0,796 620,848.0 405.0,796" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="620" y="793" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6B2812">A linha leva tripole?</text><text x="620" y="812" text-anchor="middle" font-size="13" fill="#8E3A1C">definido na abertura da OS</text><text x="849.0" y="786" text-anchor="start" font-size="13" font-weight="650" fill="#8E3A1C">sim</text><line x1="620" y1="848" x2="620" y2="894" stroke="#54666C" stroke-width="1.6" marker-end="url(#a)"/><rect x="385.0" y="894" width="470" height="96" rx="12" fill="#E2F4EE" stroke="#0B7A5D" stroke-width="1.2"/><text x="620.0" y="923.0" text-anchor="middle" font-size="17" font-weight="700" fill="#06503C">Conferente aplica o tripole e lança no tablet</text><text x="620.0" y="945.0" text-anchor="middle" font-size="13.5" fill="#0B7A5D">ele mesmo aplica na câmara e digita quantos sacos usou</text><text x="620.0" y="962.0" text-anchor="middle" font-size="13.5" fill="#0B7A5D">sacos inteiros · baixa do saldo de quem é o insumo</text><path d="M 385.0 796 L 353.0 796 L 353.0 1011 L 383.0 1011" fill="none" stroke="#54666C" stroke-width="1.6" marker-end="url(#a)"/><text x="361.0" y="787" text-anchor="start" font-size="13" font-weight="650" fill="#8E3A1C">não</text><line x1="620" y1="990" x2="620" y2="1032" stroke="#54666C" stroke-width="1.6" marker-end="url(#a)"/><rect x="385.0" y="1032" width="470" height="78" rx="12" fill="#F2F4F5" stroke="#6B7B80" stroke-width="1.2"/><text x="620.0" y="1060.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1E2C31">Esteira de
